<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riyadh Agency Atlas — 654 Recruitment Offices</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
:root{
  --bg:#0a0f1e; --panel:rgba(15,22,41,.88); --panel2:rgba(21,30,54,.75);
  --line:rgba(255,255,255,.08); --txt:#e9edf6; --mut:#8b94ab; --gold:#f0b429;
  --A:#22c55e; --B:#3b82f6; --C:#f59e0b; --D:#f97316; --X:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--txt)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#2a3550;border-radius:6px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
#app{display:flex;height:100vh;height:100dvh}

/* ---------- sidebar ---------- */
#side{width:392px;min-width:392px;height:100%;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(14px);border-right:1px solid var(--line);z-index:20;transition:margin .3s}
#side.closed{margin-left:-392px}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.brand h1 .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.brand p{color:var(--mut);font-size:12px;margin-top:5px;line-height:1.5}
.searchwrap{padding:12px 14px 6px}
#q{width:100%;padding:11px 14px 11px 38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:13.5px;outline:none;transition:border .2s, box-shadow .2s}
#q:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.15)}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:26px;top:23px;width:15px;height:15px;stroke:var(--mut)}
.tiers{display:flex;gap:6px;padding:10px 14px 4px;flex-wrap:wrap}
.tchip{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;padding:7px 4px 6px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s;user-select:none}
.tchip b{font-size:15px}.tchip span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.tchip .bub{width:8px;height:8px;border-radius:50%;margin-bottom:4px}
.tchip.off{opacity:.32;filter:grayscale(.8)}
.tchip:hover{border-color:rgba(255,255,255,.25)}
.pills{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap}
.pill{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);cursor:pointer;transition:all .15s;user-select:none}
.pill.on{background:rgba(240,180,41,.15);border-color:var(--gold);color:var(--gold)}
#stats{margin:4px 14px 10px;padding:12px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
#stats .srow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:8px}
#stats .srow b{color:var(--txt)}
.bars{display:flex;height:8px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.06)}
.bars div{transition:flex .4s}
#count{padding:2px 16px 8px;font-size:12px;color:var(--mut)}
#count b{color:var(--gold);font-size:13px}
#list{flex:1;overflow-y:auto;padding:0 10px 12px}
.ag{display:flex;gap:11px;padding:10px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:background .12s;margin-bottom:3px;align-items:flex-start}
.ag:hover{background:rgba(255,255,255,.05)}
.ag.sel{background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.35)}
.ag .tdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;box-shadow:0 0 8px currentColor}
.ag .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.ag .rn{font-size:11.5px;color:var(--mut);margin-top:1px}
.ag .meta{font-size:10.5px;color:var(--mut);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ag .meta .lic{color:#6f7ea3;font-family:ui-monospace,monospace}
.bdg{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700;letter-spacing:.3px}
.b-ph{background:rgba(34,197,94,.16);color:#4ade80}
.b-mu{background:rgba(59,130,246,.16);color:#60a5fa}
.b-img{background:rgba(240,180,41,.15);color:var(--gold)}
.b-web{background:rgba(168,85,247,.16);color:#c084fc}
.b-x{background:rgba(107,114,128,.2);color:#9ca3af}

/* ---------- map ---------- */
#mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0;background:#0a0f1e}
.leaflet-container{font:inherit}
.mk{position:relative}
.mk .p{width:13px;height:13px;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);box-shadow:0 0 10px currentColor,0 2px 6px rgba(0,0,0,.5)}
.mk.A .p{background:var(--A);color:var(--A)} .mk.B .p{background:var(--B);color:var(--B)}
.mk.C .p{background:var(--C);color:var(--C)} .mk.D .p{background:var(--D);color:var(--D)}
.mkclus{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border:2.5px solid rgba(255,255,255,.85);box-shadow:0 0 14px rgba(0,0,0,.5)}
#tools{position:absolute;top:14px;right:14px;z-index:500;display:flex;flex-direction:column;gap:8px}
.tbtn{display:flex;align-items:center;gap:8px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--txt);padding:9px 13px;border-radius:10px;font-size:12px;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tbtn:hover{border-color:var(--gold);color:var(--gold)}
.tbtn.on{border-color:var(--gold);color:var(--gold);background:rgba(240,180,41,.12)}
.tbtn svg{width:14px;height:14px}
#bms{position:absolute;top:14px;left:14px;z-index:500;display:flex;gap:6px}
.bm{padding:7px 12px;border-radius:9px;font-size:11.5px;background:var(--panel);border:1px solid var(--line);color:var(--mut);cursor:pointer;backdrop-filter:blur(10px);transition:all .15s}
.bm.on{color:var(--gold);border-color:var(--gold)}
#legend{position:absolute;bottom:18px;left:14px;z-index:500;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:11.5px;color:var(--mut);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#legend .li{display:flex;align-items:center;gap:8px;margin-top:4px}
#legend .li i{width:9px;height:9px;border-radius:50%;display:inline-block}
#legend b{color:var(--txt);font-size:12px}
#burger{position:absolute;top:14px;left:14px;z-index:501;display:none}
.myloc{position:relative;width:14px;height:14px}
.myloc .dot{position:absolute;inset:0;border-radius:50%;background:#3b82f6;border:2.5px solid #fff;box-shadow:0 0 10px rgba(59,130,246,.9)}
.myloc .pulse{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(59,130,246,.55);animation:pl 2s ease-out infinite}
@keyframes pl{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.7);opacity:0}}
#toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:10px;font-size:12.5px;z-index:800;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;backdrop-filter:blur(10px);white-space:nowrap;max-width:92vw;text-overflow:ellipsis;overflow:hidden}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- detail card ---------- */
#detail{position:absolute;top:0;right:0;height:100%;width:415px;max-width:94vw;background:var(--panel);backdrop-filter:blur(16px);border-left:1px solid var(--line);z-index:600;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
#detail.open{transform:translateX(0)}
#dphoto{position:relative;height:210px;flex:none;background:linear-gradient(135deg,#1a2340,#0d1428)}
#dphoto #dimg{width:100%;height:100%;object-fit:cover}
#dphoto .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,15,30,.95) 0%,transparent 55%)}
#dphoto .tier{position:absolute;top:12px;left:12px;padding:5px 11px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.4px;color:#0a0f1e}
#dclose{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(10,15,30,.7);border:1px solid var(--line);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dclose:hover{border-color:var(--gold);color:var(--gold)}
#dtitle{position:absolute;bottom:10px;left:14px;right:14px}
#dtitle .nm{font-size:17px;font-weight:700;line-height:1.25;text-shadow:0 2px 8px #000}
#dtitle .rn{font-size:13px;color:#c9d2e6;margin-top:2px;text-shadow:0 2px 8px #000}
#dlogo{position:absolute;bottom:-24px;right:14px;width:56px;height:56px;border-radius:12px;background:#fff;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.5);object-fit:contain}
#dbody{flex:1;overflow-y:auto;padding:16px 16px 20px}
.stars{color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:10px}
.stars span{color:var(--mut);letter-spacing:0;font-size:11.5px;margin-left:6px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.abtn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);text-decoration:none;cursor:pointer;transition:all .15s}
.abtn:hover{border-color:var(--gold);color:var(--gold)}
.abtn.prime{background:rgba(240,180,41,.14);border-color:rgba(240,180,41,.5);color:var(--gold)}
.abtn svg{width:12px;height:12px}
.sec{margin-bottom:15px}
.sec h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.sec h3:after{content:'';flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;font-size:12.5px}
.kv .k{color:var(--mut)}
.kv .v{line-height:1.45;word-break:break-word}
.kv .v a{color:#7db4ff;text-decoration:none}.kv .v a:hover{text-decoration:underline}
.sig{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.sig:last-child{border-bottom:none}
.sig i{width:17px;height:17px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;font-weight:700}
.sig .ok{background:rgba(34,197,94,.18);color:#4ade80}
.sig .no{background:rgba(249,115,22,.15);color:#fb923c}
.sig .val{margin-left:auto;color:var(--mut);font-size:11px}
.alert{border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px}
.alert.warn{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.35);color:#fdba74}
.alert.good{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.3);color:#86efac}
.alert.info{background:rgba(59,130,246,.09);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
#dnav{flex:none;display:flex;border-top:1px solid var(--line)}
#dnav button{flex:1;padding:12px;background:none;border:none;color:var(--mut);font-size:12px;cursor:pointer;transition:color .15s}
#dnav button:hover{color:var(--gold)}
#dnav button+button{border-left:1px solid var(--line)}
#hamb{display:none}

/* ---------- responsive: tablets & phones ---------- */
@media (max-width:860px){
  #side{position:absolute;top:0;left:0;bottom:0;height:auto;width:min(420px,100vw);min-width:0;margin-left:0;transform:none;transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:640;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #side.closed{margin-left:0;transform:translateX(-106%)}
  #hamb{display:flex;position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:650;width:42px;height:42px;border-radius:11px;background:var(--panel);border:1px solid var(--line);color:var(--txt);align-items:center;justify-content:center;cursor:pointer;font-size:18px;backdrop-filter:blur(10px);-webkit-tap-highlight-color:transparent}
  #bms{top:calc(12px + env(safe-area-inset-top));left:64px;right:64px;flex-wrap:wrap}
  .bm{flex:1;min-width:0;text-align:center;padding:10px 8px;font-size:11px;-webkit-tap-highlight-color:transparent}
  #tools{top:calc(12px + env(safe-area-inset-top));right:12px}
  .tbtn{padding:11px;-webkit-tap-highlight-color:transparent}
  .tbtn span{display:none}
  .tbtn svg{width:16px;height:16px}
  #legend{bottom:calc(52px + env(safe-area-inset-bottom));left:12px;padding:9px 12px;cursor:pointer;max-width:72vw;-webkit-tap-highlight-color:transparent}
  #legend .li{display:none}
  #legend.open .li{display:flex}
  #legend:after{content:'▾';float:right;color:var(--gold);margin-left:10px}
  #legend.open:after{content:'▴'}
  #detail{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;height:66%;height:66dvh;transform:translateY(106%);border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6)}
  #detail.open{transform:translateY(0)}
  #detail.dragging{transition:none}
  #detail:before{content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);z-index:2}
  #dphoto{height:150px;touch-action:none}
  #dlogo{width:48px;height:48px;bottom:-20px}
  #dbody{padding:14px 14px 16px;-webkit-overflow-scrolling:touch}
  #dnav{padding-bottom:env(safe-area-inset-bottom)}
  #dnav button{padding:13px;font-size:12.5px;min-height:44px}
  .ag{padding:12px 10px}
  .abtn{padding:9px 12px;min-height:36px}
  .pill{padding:8px 12px;font-size:11.5px;min-height:32px}
  .tchip{padding:9px 4px 8px}
  #q{font-size:16px}
  .brand{padding-left:60px}
  .leaflet-bottom{z-index:550}
  .leaflet-control-zoom a{width:38px!important;height:38px!important;line-height:38px!important;font-size:18px!important}
  .leaflet-control-attribution{font-size:9px!important;line-height:1.35!important}
}
@media (max-width:520px){
  .bm{font-size:10.5px;padding:9px 6px}
  .brand h1{font-size:17px}
  #legend{font-size:10.5px}
  #dphoto{height:132px}
}

</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="brand">

    <div id="stats"></div>
    <div id="count"></div>
    <div id="list"></div>

      <button class="tbtn" id="heatbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="4"/></svg><span>Heatmap</span></button>
      <button class="tbtn" id="csvbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg><span>Export CSV</span></button>
      <button class="tbtn" id="resetbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-9 9Zm9-5v5l3 3"/></svg><span>Reset view</span></button>

    <div id="legend"><b>Confidence tier</b>

      <div class="li"><i style="background:var(--C)"></i>C — approximate</div>
      <div class="li"><i style="background:var(--D)"></i>D — rough lead</div>
      <div class="li"><i style="background:var(--X)"></i>X — unverifiable</div>
    </div>
    <div id="toast"></div>
    <div id="detail">
      <div id="dphoto">
        <img id="dimg" alt="" style="display:none">
        <div class="grad"></div>
        <div class="tier" id="dtier"></div>
        <button id="dclose">✕</button>
        <div id="dtitle"><div class="nm" id="dnm"></div><div class="rn" id="drn" dir="auto"></div></div>
        <img id="dlogo" alt="" style="display:none">
      </div>
      <div id="dbody"></div>
      <div id="dnav"><button id="dprev">← Prev</button><button id="dnext">Next →</button></div>
    </div>
  </div>
</div>

const clus = L.markerClusterGroup({

    const n=c.getChildCount(); const s=n<10?34:n<50?42:50;

/* ---------- my location ---------- */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
let locWatch=null, locMarker=null, locCircle=null;
const locBtn = document.getElementById('locbtn');
function locStop(){
  if(locWatch!=null){ navigator.geolocation.clearWatch(locWatch); locWatch=null; }
  if(locMarker){ map.removeLayer(locMarker); locMarker=null; }
  if(locCircle){ map.removeLayer(locCircle); locCircle=null; }
  locBtn.classList.remove('on');
}
locBtn.onclick = ()=>{
  if(locWatch!=null){ locStop(); return; }
  if(!('geolocation' in navigator)){ toast('Geolocation is not supported by this browser'); return; }
  locBtn.classList.add('on');
  let first=true;
  locWatch = navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    const acc=pos.coords.accuracy||0;
    if(!locMarker){
      locMarker=L.marker(ll,{interactive:false,zIndexOffset:1000,icon:L.divIcon({className:'',html:'<div class="myloc"><div class="pulse"></div><div class="dot"></div></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);
      locCircle=L.circle(ll,{radius:acc,color:'#3b82f6',weight:1,opacity:.5,fillColor:'#3b82f6',fillOpacity:.12,interactive:false}).addTo(map);
    } else {
      locMarker.setLatLng(ll); locCircle.setLatLng(ll); locCircle.setRadius(acc);
    }
    if(first){ map.flyTo(ll, Math.max(map.getZoom(),15), {duration:.9}); first=false; }
  }, err=>{
    locStop();
    toast(err.code===1 ? 'Location permission denied — allow it in the browser address bar' : 'Location unavailable (needs localhost or HTTPS)');
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
};

/* ---------- markers ---------- */
const markerById = {};
function makeMarker(a){
  const m = L.marker([a.lat,a.lng],{tier:a.tier,icon:L.divIcon({className:'',html:`<div class="mk ${a.tier}"><div class="p"></div></div>`,iconSize:[13,13],iconAnchor:[6,6]})});
  m.on('click',()=>select(a.id,true));
  markerById[a.id]=m;
  return m;
}

/* ---------- filtering ---------- */
function matches(a){
  if(!state.tiers.has(a.tier)) return false;
  if(state.phok && !a.phok) return false;
  if(state.mu && !a.mun) return false;
  if(state.img && !(a.photo||a.logo)) return false;
  if(state.web && !a.web) return false;
  if(state.w2 && !a.w2o) return false;
  if(state.conflict && !a.mucf) return false;
  if(state.q){
    const q = state.q.toLowerCase();
    const hay = [a.name,a.rn,a.lic,a.addr,a.phl,a.phm,a.email,a.mun,a.mud,a.street].filter(Boolean).join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function applyFilters(){
  filtered = A.filter(matches);
  clus.clearLayers();
  clus.addLayers(filtered.filter(a=>a.lat).map(makeMarker));
  if(heat){ const pts=filtered.filter(a=>a.lat).map(a=>[a.lat,a.lng,{A:1,B:.8,C:.55,D:.3,X:.05}[a.tier]||.2]); heat.setLatLngs(pts); }
  renderList();
  document.getElementById('count').innerHTML = `<b>${filtered.length}</b> of ${A.length} agencies · ${filtered.filter(a=>a.lat).length} pinned`;
}

/* ---------- list ---------- */
const listEl = document.getElementById('list');
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderList(){
  const frag = document.createDocumentFragment();
  filtered.forEach(a=>{
    const el = document.createElement('div');
    el.className = 'ag'+(a.id===selId?' sel':'');
    const badges = [];
    if(a.phok) badges.push('<span class="bdg b-ph">PHONE ✓</span>');
    if(a.mun) badges.push('<span class="bdg b-mu">MUSANED</span>');
    if(a.photo||a.logo) badges.push('<span class="bdg b-img">IMG</span>');
    if(a.web) badges.push('<span class="bdg b-web">WEB</span>');
    if(!a.lat) badges.push('<span class="bdg b-x">NO PIN</span>');
    el.innerHTML = `<div class="tdot" style="background:${TIERS[a.tier]};color:${TIERS[a.tier]}"></div>
      <div style="min-width:0"><div class="nm">${esc(a.name)}</div>
      ${a.rn?`<div class="rn" dir="auto">${esc(a.rn)}</div>`:''}
      <div class="meta"><span class="lic">${esc(a.lic)}</span>${badges.join('')}</div></div>`;
    el.onclick = ()=>select(a.id, !!a.lat);
    frag.appendChild(el);
  });
  listEl.innerHTML=''; listEl.appendChild(frag);
}

    el.innerHTML = `<span class="bub" style="background:${TIERS[t]}"></span><b>${APP.stats.tiers[t]}</b><span>${t}</span>`;
    el.onclick = ()=>{ state.tiers.has(t)?state.tiers.delete(t):state.tiers.add(t);
      el.classList.toggle('off',!state.tiers.has(t)); applyFilters(); };
    tc.appendChild(el);
  });
  const defs = [['phok','Phone ✓'],['mu','Musaned'],['img','Has image'],['web','Website'],['w2','Deep-verified'],['conflict','Conflicts']];
  const pl = document.getElementById('pills');
  defs.forEach(([k,lbl])=>{
    const el = document.createElement('div'); el.className='pill'; el.textContent=lbl;
    el.onclick = ()=>{ state[k]=!state[k]; el.classList.toggle('on',state[k]); applyFilters(); };
    pl.appendChild(el);
  });
})();
let qT;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(qT); qT=setTimeout(()=>{ state.q=e.target.value.trim(); applyFilters(); },160);
});
const isMobile = ()=>innerWidth<=860;
const sideEl = document.getElementById('side');
document.getElementById('hamb').onclick = ()=>{ sideEl.classList.toggle('closed'); setTimeout(()=>map.invalidateSize(),330); };
if(isMobile()) sideEl.classList.add('closed');
map.on('click', ()=>{ if(isMobile()) sideEl.classList.add('closed'); });
const legendEl = document.getElementById('legend');
legendEl.addEventListener('click', ()=>{ if(isMobile()) legendEl.classList.toggle('open'); });
window.addEventListener('resize', ()=>map.invalidateSize());
window.addEventListener('orientationchange', ()=>setTimeout(()=>map.invalidateSize(),250));

/* ---------- detail ---------- */
const det = document.getElementById('detail');
document.getElementById('dclose').onclick = ()=>{ det.classList.remove('open'); selId=null; renderList(); };
document.getElementById('dprev').onclick = ()=>step(-1);
document.getElementById('dnext').onclick = ()=>step(1);
/* bottom-sheet drag-to-close (mobile) */
(function(){
  const photo = document.getElementById('dphoto');
  let y0 = null, dy = 0;
  photo.addEventListener('touchstart', e=>{ if(!isMobile()) return; y0 = e.touches[0].clientY; dy = 0; det.classList.add('dragging'); }, {passive:true});
  photo.addEventListener('touchmove', e=>{ if(y0==null) return; dy = Math.max(0, e.touches[0].clientY - y0); det.style.transform = `translateY(${dy}px)`; }, {passive:true});
  photo.addEventListener('touchend', ()=>{ if(y0==null) return; det.classList.remove('dragging'); det.style.transform = '';
    if(dy > 110){ det.classList.remove('open'); selId = null; renderList(); } y0 = null; });
})();
function step(d){
  if(!filtered.length) return;
  let i = filtered.findIndex(a=>a.id===selId);
  i = (i+d+filtered.length)%filtered.length;
  select(filtered[i].id, !!filtered[i].lat);
}
function stars(r){
  if(!r) return '';
  const full = Math.round(r);
  return '★'.repeat(full)+'☆'.repeat(5-full)+`<span>${r} / 5 on Google</span>`;
}
function sig(label, ok, val){
  return `<div class="sig"><i class="${ok?'ok':'no'}">${ok?'✓':'!'}</i>${label}<span class="val">${val||''}</span></div>`;
}
function openDetail(a){
  selId = a.id; renderList();
  const img = document.getElementById('dimg');
  const logo = document.getElementById('dlogo');
  img.style.display='none'; logo.style.display='none';
  if(a.photo){ img.src=a.photo; img.style.display='block';
    img.onerror=()=>{ img.style.display='none'; if(a.logo){logo.src=a.logo;logo.style.display='block';} };
    if(a.logo){ logo.src=a.logo; logo.style.display='block'; }
  } else if(a.logo){ logo.src=a.logo; logo.style.display='block'; }
  const dt = document.getElementById('dtier');
  dt.textContent = TIERLBL[a.tier]; dt.style.background = TIERS[a.tier];
  document.getElementById('dnm').textContent = a.name;
  document.getElementById('drn').textContent = a.rn||'';
  const latlng = a.lat?`${a.lat.toFixed(6)}, ${a.lng.toFixed(6)}`:'—';
  const gq = a.lat?`https://www.google.com/maps?q=${a.lat},${a.lng}`:null;
  const sv = a.lat?`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${a.lat},${a.lng}`:null;
  let h = '';
  if(a.rate) h += `<div class="stars">${stars(a.rate)}</div>`;
  h += `<div class="actions">`;
  if(a.gurl) h += `<a class="abtn prime" href="${a.gurl}" target="_blank">Google Maps ↗</a>`;
  if(gq) h += `<a class="abtn" href="${gq}" target="_blank">Directions ↗</a>`;
  if(sv) h += `<a class="abtn" href="${sv}" target="_blank">Street View ↗</a>`;
  if(a.lat) h += `<span class="abtn" onclick="navigator.clipboard.writeText('${a.lat},${a.lng}');this.textContent='Copied ✓'">Copy coords</span>`;
  if(a.web) h += `<a class="abtn" href="${a.web.startsWith('http')?a.web:'http://'+a.web}" target="_blank">Website ↗</a>`;
  if(a.phm||a.phl) h += `<a class="abtn" href="tel:${(a.phm||a.phl).replace(/[^\d+]/g,'')}">Call</a>`;
  h += `</div>`;
  if(a.w2e) h += `<div class="alert good"><b>Deep-verified (${esc(a.w2o)}).</b> ${esc(a.w2e)}${a.w2u?` <a href="${a.w2u}" target="_blank" style="color:inherit">source ↗</a>`:''}</div>`;
  if(a.mucf) h += `<div class="alert warn"><b>Location conflict:</b> the official Musaned address geocodes ${a.mucf} km from this pin. Treat with caution — check the Musaned address below.</div>`;
  if(a.muco) h += `<div class="alert info">Official Musaned address corroborates this pin (≤1.5 km).</div>`;
  if(a.rej) h += `<div class="alert warn"><b>Rejected wrong match:</b> ${esc(a.rej)} — replaced with an in-Riyadh place.</div>`;
  if(a.tier==='X') h += `<div class="alert warn"><b>No verifiable Riyadh location.</b> ${esc(a.w2e)||'Exhaustive search found no reliable pin for this agency.'}</div>`;
  h += `<div class="sec"><h3>Location</h3><div class="kv">
    <span class="k">Coordinates</span><span class="v" style="font-family:ui-monospace,monospace">${latlng}</span>
    ${a.addr?`<span class="k">Address</span><span class="v" dir="auto">${esc(a.addr)}</span>`:''}
    ${a.plus?`<span class="k">Plus code</span><span class="v">${esc(a.plus)}</span>`:''}
    ${a.hours?`<span class="k">Hours</span><span class="v">${esc(a.hours)}</span>`:''}
    ${a.cat?`<span class="k">Category</span><span class="v">${esc(a.cat)}</span>`:''}
    ${a.pin>1?`<span class="k">Shared pin</span><span class="v">${a.pin} agencies at this building</span>`:''}
  </div></div>`;
  h += `<div class="sec"><h3>LMIS registration</h3><div class="kv">
    <span class="k">License</span><span class="v" style="font-family:ui-monospace,monospace">${esc(a.lic)}</span>
    <span class="k">Phone</span><span class="v">${esc(a.phl)}${a.phok?' <span class="bdg b-ph">= Maps ✓</span>':''}</span>
    ${a.email?`<span class="k">Email</span><span class="v"><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></span>`:''}
    <span class="k">Street</span><span class="v" style="text-transform:capitalize">${esc(a.street||'—')}</span>
  </div></div>`;
  if(a.mun) h += `<div class="sec"><h3>Musaned — official Saudi registry</h3><div class="kv">
    <span class="k">Name</span><span class="v" dir="auto">${esc(a.mun)}</span>
    ${a.muaddr?`<span class="k">Address</span><span class="v" dir="auto">${esc(a.muaddr)}</span>`:''}
    ${a.mud?`<span class="k">District</span><span class="v" dir="auto">${esc(a.mud)}</span>`:''}
    ${a.muph?`<span class="k">Phone</span><span class="v">${esc(a.muph)}</span>`:''}
    <span class="k">Matched via</span><span class="v">${esc(a.muon)}</span>
  </div></div>`;
  h += `<div class="sec"><h3>Verification signals</h3>`;
  h += sig('Google listing phone = LMIS phone', a.phok, a.phm||'');
  h += sig('Street name in resolved address', (a.sh||0)>=0.25, a.sh!=null?(100*a.sh).toFixed(0)+'%':'');
  h += sig('Name similarity', (a.sim||0)>=0.3, a.sim!=null?a.sim.toFixed(2):'');
  h += sig('Match channel', true, (a.src||'')+(a.verdict?' · '+a.verdict:''));
  if(a.dold!=null) h += sig('Distance from old pipeline pin', a.dold<=1.5, a.dold+' km');
  h += `</div>`;
  document.getElementById('dbody').innerHTML = h;
  det.classList.add('open');
}
function select(id, fly){
  const a = byId[id]; if(!a) return;
  openDetail(a);
  if(isMobile()) sideEl.classList.add('closed');
  if(fly && a.lat){
    map.flyTo([a.lat,a.lng], Math.max(map.getZoom(),14), {duration:.9});
    const m = markerById[id];
    if(m) setTimeout(()=>{ try{ m.unbindTooltip().bindTooltip(a.name,{direction:'top',offset:[0,-8]}).openTooltip(); }catch(e){} },950);
  }
  document.querySelectorAll('#list .ag').forEach((el,i)=>{ if(filtered[i] && filtered[i].id===id) el.scrollIntoView({block:'nearest'}); });
}

/* ---------- export ---------- */
document.getElementById('csvbtn').onclick = ()=>{
  const cols = ['name','lic','tier','lat','lng','addr','phl','phm','email','web','cat','gurl'];
  const esc2 = v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  let csv = cols.join(',')+'\n' + filtered.map(a=>cols.map(c=>esc2(a[c])).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  const l = document.createElement('a'); l.href=url; l.download='riyadh_agencies_filtered.csv'; l.click();
  URL.revokeObjectURL(url);
};

/* ---------- boot ---------- */
document.getElementById('bdate').textContent = 'Data: July 2026.';
applyFilters();
map.attributionControl.setPrefix('Riyadh Agency Atlas');
</script>
</body>
</html>
